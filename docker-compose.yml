name: onexis-zeiterfassung

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeiterfassung}
      POSTGRES_USER: ${POSTGRES_USER:-zeiterfassung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeiterfassung} -d ${POSTGRES_DB:-zeiterfassung}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Kein "ports:" — die Datenbank ist bewusst nur im internen
    # Compose-Netzwerk erreichbar, nicht vom Host/Internet aus.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-zeiterfassung}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zeiterfassung}"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET muss in .env gesetzt sein}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL muss in .env gesetzt sein, z.B. https://zeit.deine-firma.ch}
      SMTP_HOST: ${SMTP_HOST:-mail.infomaniak.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ONEXIS Zeiterfassung <no-reply@example.ch>}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    # Kein "ports:" — nur Caddy ist von aussen erreichbar, die App selbst
    # ist nur im internen Compose-Netzwerk sichtbar.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN muss in .env gesetzt sein, z.B. zeit.deine-firma.ch}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
