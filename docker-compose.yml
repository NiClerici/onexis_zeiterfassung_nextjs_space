name: onexis-zeiterfassung

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeiterfassung}
      POSTGRES_USER: ${POSTGRES_USER:-zeiterfassung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeiterfassung} -d ${POSTGRES_DB:-zeiterfassung}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Kein "ports:" — die Datenbank ist bewusst nur im internen
    # Compose-Netzwerk erreichbar, nicht vom Host/Internet aus.

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # GIT_SHA kommt von deploy/deploy.sh (export vor "docker compose up
      # --build"). Landet im Image als APP_VERSION (Dockerfile) — bewusst
      # NICHT zusätzlich unter "environment:" unten gesetzt, sonst würde ein
      # leerer/undefinierter Wert von hier die im Image gebackene ENV beim
      # Container-Start überschreiben.
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-zeiterfassung}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zeiterfassung}"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET muss in .env gesetzt sein}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL muss in .env gesetzt sein, z.B. https://zeit.deine-firma.ch}
      SMTP_HOST: ${SMTP_HOST:-mail.infomaniak.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ONEXIS Zeiterfassung <no-reply@example.ch>}
      # Allowlist für die Developer-Übersicht (/dev, lib/dev-access.ts).
      # Leer/ungesetzt heisst fail-closed: niemand hat Zugriff.
      DEVELOPER_EMAILS: ${DEVELOPER_EMAILS:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    # Kein "ports:" — nur Caddy ist von aussen erreichbar, die App selbst
    # ist nur im internen Compose-Netzwerk sichtbar.

  migrate:
    # Einmal-Container für "prisma migrate deploy" (deploy/README.md
    # Abschnitt 2 und 3). Läuft bewusst gegen die "builder"-Stage statt
    # gegen das Laufzeit-Image: der Next.js-Standalone-Output im runner
    # enthält weder das prisma-CLI (devDependency, wird vom Tracing nicht
    # mitgenommen) noch prisma/schema.prisma und prisma/migrations/ — ein
    # "docker compose exec app npx prisma migrate deploy" scheitert dort
    # zwangsläufig. Die builder-Stage hat beides und liegt nach
    # "up -d --build" ohnehin schon im Build-Cache.
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    # Startet nicht bei "docker compose up -d" mit; "docker compose run"
    # aktiviert das Profil für diesen einen Aufruf automatisch.
    profiles: ["tools"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-zeiterfassung}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zeiterfassung}"
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN muss in .env gesetzt sein, z.B. zeit.deine-firma.ch}
      # Zweite Site hinter demselben Caddy: Frappe CRM, das als eigenes
      # Compose-Projekt läuft (~/crm auf der VM, deploy/README.md Abschnitt 8).
      CRM_DOMAIN: ${CRM_DOMAIN:?CRM_DOMAIN muss in .env gesetzt sein, z.B. crm.deine-firma.ch}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    # "default" muss hier ausdrücklich mit aufgeführt werden: sobald
    # "networks:" gesetzt ist, hängt Compose den Service nicht mehr
    # automatisch ans Projekt-Netz, und Caddy würde "app" nicht mehr erreichen.
    networks:
      - default
      - proxy

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  # Gemeinsames Netz mit dem Frappe-CRM-Projekt, damit Caddy "crm-frontend"
  # erreicht. Gehört keinem der beiden Compose-Projekte, deshalb "external":
  # einmalig per "docker network create proxy" anlegen (deploy/README.md
  # Abschnitt 8) — ohne das bricht "docker compose up" mit "network proxy
  # declared as external, but could not be found" ab.
  proxy:
    external: true
